    <!-- Anti-FOUC Theme Initialization (Defaults to Vice Night Dark Mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            var metaLight = document.querySelector('meta[name="theme-color"]');
            if (metaLight) metaLight.setAttribute('content', '#fff9f6');
          } else {
            document.documentElement.classList.add('dark');
            var metaDark = document.querySelector('meta[name="theme-color"]');
            if (metaDark) metaDark.setAttribute('content', '#0b0614');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
